<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 250" fill="none" class="px-custon-brand">
  <defs>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#FF1A2D" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Outer Black Sticker Contour -->
  <path d="M 115 15 C 65 15, 20 60, 20 120 C 20 180, 60 225, 120 225 C 145 225, 168 215, 185 200 L 490 200 C 510 200, 515 185, 515 170 L 515 125 C 515 105, 495 90, 400 90 L 375 25 C 365 15, 340 15, 310 15 Z" fill="#000000" stroke="#1c1c1c" stroke-width="3" />

  <!-- Turbo / Subwoofer Horn Contour (Left) -->
  <g transform="translate(15, 10)">
    <!-- Outer horn rim -->
    <path d="M 95 25 C 55 25, 25 65, 25 115 C 25 165, 55 200, 95 200 C 115 200, 130 190, 140 175 C 120 175, 75 160, 70 115 C 65 70, 110 45, 135 45 C 125 32, 110 25, 95 25 Z" fill="#FFFFFF" />
    <!-- Inner horn depth -->
    <path d="M 60 115 C 60 85, 85 58, 110 50 C 90 60, 80 85, 80 115 C 80 145, 95 168, 115 175 C 90 170, 60 148, 60 115 Z" fill="#0A0A0A" />
    <!-- Central cone highlight -->
    <ellipse cx="108" cy="115" rx="14" ry="42" fill="#FFFFFF" />
    <ellipse cx="109" cy="115" rx="8" ry="28" fill="#000000" />
  </g>

  <!-- Letter P (White bold automotive stencil) -->
  <g transform="translate(160, 80)">
    <path d="M 0 0 L 0 85 L 26 85 L 26 52 L 48 52 C 68 52, 78 40, 78 26 C 78 10, 66 0, 48 0 Z M 26 18 L 44 18 C 50 18, 53 21, 53 26 C 53 31, 50 34, 44 34 L 26 34 Z" fill="#FFFFFF" />
  </g>

  <!-- Letter X (Automotive Red with dynamic angles) -->
  <g transform="translate(235, 70)" filter="url(#neon-glow)">
    <!-- Top-left to bottom-right arm with connector -->
    <polygon points="12,10 42,10 98,95 68,95" fill="#FF1A2D" />
    <!-- Top-right to bottom-left arm -->
    <polygon points="68,10 98,10 12,95 0,78 52,50" fill="#FF1A2D" />
  </g>

  <!-- Frequency Audio Wave / Tachometer Pulse Line with Arrow -->
  <g transform="translate(140, 160)" filter="url(#neon-glow)">
    <!-- Base horizontal line -->
    <rect x="0" y="3" width="185" height="7" fill="#FF1A2D" />
    
    <!-- Arrow pointing down-left at the base of X -->
    <polygon points="98,3 82,24 114,24" fill="#FF1A2D" transform="rotate(35 98 12)" />
    
    <!-- Sound frequency peaks -->
    <polyline points="180,6 200,-15 215,22 230,-22 245,24 260,-18 275,18 290,-8 305,6 355,6" fill="none" stroke="#FF1A2D" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- CUSTON typography (White stencil bold) -->
  <g transform="translate(285, 205)">
    <!-- C -->
    <path d="M 22 2 L 7 2 C 2 2, 0 5, 0 12 L 0 18 C 0 25, 2 28, 7 28 L 22 28 L 22 22 L 7 22 L 7 8 L 22 8 Z" fill="#FFFFFF" />
    <!-- U -->
    <path d="M 30 2 L 37 2 L 37 21 C 37 23, 38 24, 41 24 C 44 24, 45 23, 45 21 L 45 2 L 52 2 L 52 20 C 52 26, 48 28, 41 28 C 34 28, 30 26, 30 20 Z" fill="#FFFFFF" />
    <!-- S -->
    <path d="M 60 2 L 78 2 L 78 7 L 66 7 L 66 12 L 78 15 L 78 28 L 60 28 L 60 22 L 72 22 L 72 18 L 60 15 Z" fill="#FFFFFF" />
    <!-- T -->
    <path d="M 85 2 L 105 2 L 105 7 L 98 7 L 98 28 L 92 28 L 92 7 L 85 7 Z" fill="#FFFFFF" />
    <!-- O -->
    <path d="M 112 2 L 128 2 C 133 2, 135 5, 135 12 L 135 18 C 135 25, 133 28, 128 28 L 112 28 C 107 28, 105 25, 105 18 L 105 12 C 105 5, 107 2, 112 2 Z M 112 8 L 112 22 L 128 22 L 128 8 Z" fill="#FFFFFF" />
    <!-- N -->
    <path d="M 142 2 L 149 2 L 160 18 L 160 2 L 166 2 L 166 28 L 159 28 L 148 11 L 148 28 L 142 28 Z" fill="#FFFFFF" />
  </g>
</svg>
